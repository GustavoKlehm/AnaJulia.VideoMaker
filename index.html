<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/brand/logo-anajulia-icon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/brand/logo-anajulia-icon-negativo.png"
      media="(prefers-color-scheme: dark)"
    />
    <link id="favicon" rel="icon" type="image/png" href="/brand/logo-anajulia-icon.png" />
    <link rel="apple-touch-icon" href="/brand/logo-anajulia-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ana Julia — Storymaker e Videomaker. Transformando momentos em histórias."
    />
    <title>Ana Julia — Storymaker e Videomaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const light = '/brand/logo-anajulia-icon.png'
        const dark = '/brand/logo-anajulia-icon-negativo.png'
        const icon = document.getElementById('favicon')
        const scheme = window.matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          if (icon) icon.setAttribute('href', scheme.matches ? dark : light)
        }
        apply()
        scheme.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
